version: "3.8"

services:
  db:
    image: postgres:15
    container_name: shopadmin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopadmin
    ports:
      - "5432:5432"
    volumes:
      - shopadmin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopadmin_pgdata:
